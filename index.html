<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DG Promoter Hub</title>
<link rel="icon" type="image/png" href="dg-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=IBM+Plex+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0b0c;--card:#151517;--card2:#1c1c1f;--line:#2b2b30;--text:#f2f2f3;--muted:#9c9ca6;--accent:#ff2e2e;--accent2:#ff7a7a;--good:#3fd08a;--gold:#f6c343;--soon:#6d6d78}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 Archivo,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
a{color:inherit}
.wrap{max-width:1020px;margin:0 auto;padding:0 16px 64px}
header{position:sticky;top:0;z-index:5;background:rgba(11,11,12,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;gap:14px;padding-top:12px;padding-bottom:12px;flex-wrap:wrap}
.brand{font-weight:900;letter-spacing:.04em;font-size:17px;text-decoration:none;text-transform:uppercase}
.brand span{color:var(--accent)}
.brand{display:inline-flex;align-items:center;gap:8px}.brand img{height:22px;width:auto;display:block}
nav{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
nav a{text-decoration:none;padding:7px 12px;border-radius:99px;font-size:14px;color:var(--muted);font-weight:600}
nav a.on{background:var(--accent);color:#fff}
nav a:not(.on):hover{color:var(--text);background:var(--card2)}
h1{font-size:34px;line-height:1.05;margin:30px 0 8px;letter-spacing:-.02em;font-weight:900;text-transform:uppercase}
h1 em{font-style:normal;color:var(--accent)}
.hero{position:relative;overflow:hidden;margin:22px 0 8px;padding:20px 22px 22px;border-radius:14px;border:1px solid var(--line);
  background:repeating-linear-gradient(115deg,transparent 0 22px,rgba(255,46,46,.07) 22px 23px),#0b0b0c}
.hero::after{content:"";position:absolute;top:0;bottom:0;right:-60px;width:150px;background:var(--accent);transform:skewX(-14deg);pointer-events:none}
.hero>*{position:relative;z-index:1;max-width:calc(100% - 90px)}
.hero-top{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.hero-top img{height:30px;width:auto;display:block}
.hero .eyebrow{color:var(--accent);font:800 12px/1 Archivo,sans-serif;letter-spacing:.18em;text-transform:uppercase}
.hero h1{margin:0 0 8px}
.hero .sub{margin:0}
.hero-rule{width:64px;height:6px;background:var(--accent);transform:skewX(-24deg);margin-top:14px}
@media(max-width:560px){.hero::after{width:70px;right:-40px}.hero>*{max-width:calc(100% - 36px)}.hero-top img{height:24px}.hero .eyebrow{font-size:10px;letter-spacing:.14em}}
h2{font:700 12px/1 "IBM Plex Mono",monospace;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin:34px 0 12px}
.sub{color:var(--muted);margin:0 0 6px}
.small{font-size:12.5px;color:var(--muted)}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(225px,1fr))}
.grid3{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;text-decoration:none;display:block;position:relative}
a.card:hover{border-color:var(--accent)}
.card .ico{font-size:22px;margin-bottom:8px}
.card b{display:block;font-size:16px;margin-bottom:2px}
.card .big{font:900 34px/1 Archivo,sans-serif;letter-spacing:-.02em;margin:12px 0 2px;font-variant-numeric:tabular-nums}
.card .row{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-top:6px}
.card.soon{opacity:.6;border-style:dashed;cursor:default}
.card.hot{border-color:var(--accent);background:linear-gradient(135deg,rgba(255,46,46,.16),var(--card) 60%)}
.pill{display:inline-block;font:700 10.5px/1 "IBM Plex Mono",monospace;text-transform:uppercase;letter-spacing:.06em;padding:4px 8px;border-radius:99px;border:1px solid currentColor;white-space:nowrap}
.pill.soon{color:var(--soon)}.pill.hot{color:var(--accent2)}.pill.good{color:var(--good)}.pill.gold{color:var(--gold)}
.card>.pill.corner{position:absolute;top:14px;right:14px}
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--accent);color:#fff;border:0;border-radius:10px;padding:9px 14px;font:inherit;font-weight:700;cursor:pointer;text-decoration:none}
.btn.ghost{background:var(--card2);color:var(--text);border:1px solid var(--line)}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px;white-space:nowrap}
.btn[disabled]{opacity:.5;cursor:not-allowed}
input[type=search]{width:100%;background:var(--card);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:12px 14px;font:inherit}
input[type=search]:focus{outline:2px solid var(--accent);border-color:transparent}
.seg{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{background:none;border:0;color:var(--muted);font:inherit;font-size:13.5px;padding:6px 12px;border-radius:7px;cursor:pointer}
.seg button.on{background:var(--accent);color:#fff;font-weight:700}
.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:14px 0}
.tools .grow{flex:1;min-width:200px}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
th,td{padding:10px 12px;text-align:left;border-top:1px solid var(--line);font-size:14px;vertical-align:middle}
th{border-top:0;font:700 11px/1.2 "IBM Plex Mono",monospace;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);background:var(--card2)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
td.rk{width:44px;color:var(--muted);font-variant-numeric:tabular-nums}
tr.top1 td.rk{color:var(--gold);font-weight:900}tr.top2 td.rk,tr.top3 td.rk{color:var(--accent2);font-weight:900}
tr.me td{background:rgba(255,46,46,.10)}
.code{font:700 13.5px/1.2 "IBM Plex Mono",monospace;letter-spacing:.01em}
.nm{display:block;color:var(--muted);font-size:12.5px}
.tag{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 6px;margin-right:4px;white-space:nowrap;text-decoration:none;display:inline-block}
a.tag:hover{color:var(--text);border-color:var(--accent)}
.bars{display:grid;gap:9px}
.bar{display:grid;grid-template-columns:120px 1fr 64px;gap:10px;align-items:center;font-size:14px}
.bar .track{height:14px;background:var(--card2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.bar .fill{height:100%;background:var(--accent);border-radius:99px}
.bar.lead .fill{background:var(--gold)}
.bar .v{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.bar a{text-decoration:none}.bar a:hover{color:var(--accent2)}
.stats{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));margin-top:16px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stat .k{font-size:12px;color:var(--muted)}
.stat .v{font:900 26px/1.1 Archivo,sans-serif;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.alert{background:rgba(255,46,46,.12);border:2px solid var(--accent);border-radius:14px;padding:18px;margin:18px 0 0}
.alert .tag-urgent{display:inline-block;background:var(--accent);color:#fff;font:700 11px/1 "IBM Plex Mono",monospace;letter-spacing:.08em;text-transform:uppercase;padding:5px 9px;border-radius:99px;margin-bottom:10px}
.alert b.head{display:block;font-size:19px;line-height:1.25;margin-bottom:8px}
.alert ul{margin:8px 0 14px;padding-left:20px}.alert li{margin:4px 0}
.alert .alert-img{float:right;width:120px;margin:0 0 8px 12px;border-radius:6px;overflow:hidden}.alert .alert-img img{display:block;width:100%;height:auto}.alert .done-note{clear:both}
.alert .done-note{margin-top:12px;padding:10px 12px;border-radius:10px;background:rgba(255,255,255,.06);font-size:14px}
.me-card{background:linear-gradient(135deg,rgba(255,46,46,.2),var(--card) 55%);border:1px solid var(--accent);border-radius:16px;padding:18px;margin-top:12px}
.me-card .top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start}
.me-card .code{font-size:22px}
.me-nums{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin:14px 0}
.me-nums div{background:rgba(0,0,0,.28);border-radius:10px;padding:10px 12px}
.me-nums .v{font:900 24px/1.1 Archivo,sans-serif;font-variant-numeric:tabular-nums}
.prog{height:12px;border-radius:99px;background:rgba(0,0,0,.35);overflow:hidden;border:1px solid var(--line)}
.prog i{display:block;height:100%;background:var(--gold);border-radius:99px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13px}
.chip .code{font-size:12.5px}
.rules ul{margin:8px 0 0;padding-left:20px}.rules li{margin:6px 0}.rules li b{display:inline;font-size:inherit;margin:0}.rules .card{margin-bottom:12px}.rules .two{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}.rules .two .card{margin:0}
.empty{color:var(--muted);padding:18px;text-align:center}
.back{display:inline-block;margin-top:22px;color:var(--muted);text-decoration:none;font-size:14px}
.back:hover{color:var(--accent2)}
.note{background:var(--card2);border:1px dashed var(--line);border-radius:12px;padding:12px 14px;color:var(--muted);font-size:13.5px;margin-top:12px}
.copied{color:var(--good)!important}
footer{color:var(--muted);font-size:12px;margin-top:44px;border-top:1px solid var(--line);padding-top:14px}
@media (max-width:640px){
  h1{font-size:26px}.hide-sm{display:none}th,td{padding:9px 8px}
  .bar{grid-template-columns:92px 1fr 50px}
}

/* ===== MORE DG: brand layer (matches the Promoter Agreement look) ===== */
body{background:
  url(dg-logo.png) no-repeat right -60px bottom -40px/520px auto fixed,
  repeating-linear-gradient(115deg,transparent 0 34px,rgba(255,255,255,.018) 34px 35px) fixed,var(--bg)}
body::before{content:"";position:fixed;inset:0;background:var(--bg);opacity:.93;z-index:-1}
header{border-bottom:0;box-shadow:0 3px 0 var(--accent)}
.brand{font-stretch:125%;font-size:18px}.brand img{height:26px}
.ticker{background:var(--accent);color:#fff;overflow:hidden;white-space:nowrap;font:900 13px/1 Archivo,sans-serif;font-stretch:125%;text-transform:uppercase;letter-spacing:.06em;padding:8px 0;transform:skewY(-1deg);margin:10px 0 4px}
.ticker-in{display:inline-block;animation:dgtick 28s linear infinite}.ticker span{padding-right:0}
@keyframes dgtick{to{transform:translateX(-50%)}}
@media(prefers-reduced-motion:reduce){.ticker-in{animation:none}}
h1{font-stretch:125%;font-size:46px;line-height:.98;letter-spacing:0}
.hero{padding:26px 26px 26px;border-radius:6px;border:0;border-left:6px solid var(--accent);
  background:repeating-linear-gradient(115deg,transparent 0 22px,rgba(255,46,46,.10) 22px 23px),#111113}
.hero::after{width:210px;right:-70px}
.hero::before{content:"DG";position:absolute;right:120px;bottom:-34px;font:900 150px/1 Archivo,sans-serif;font-stretch:125%;color:transparent;-webkit-text-stroke:1.5px rgba(255,46,46,.35);z-index:0;pointer-events:none}
.hero-top img{height:36px}
.hero .eyebrow{font-size:13px}
h2{font:900 22px/1 Archivo,sans-serif;font-stretch:125%;color:var(--text);letter-spacing:.01em;display:flex;align-items:center;gap:12px;margin:40px 0 14px}
h2::before{content:"";flex:0 0 auto;width:26px;height:10px;background:var(--accent);transform:skewX(-24deg)}
.card,.stat{border-radius:6px}
.card{transition:border-color .15s,transform .15s}
a.card:hover{border-color:var(--accent);transform:translateY(-2px)}
a.card::after{content:"";position:absolute;top:0;right:0;width:0;height:0;border-style:solid;border-width:0 18px 18px 0;border-color:transparent var(--accent) transparent transparent;border-top-right-radius:6px}
.card b{font-stretch:112%}
.stat{border-top:3px solid var(--accent)}
.stat .v{font-stretch:125%;font-size:30px}
.btn{border-radius:3px;text-transform:uppercase;font-stretch:115%;letter-spacing:.03em;font-weight:800;clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%);padding-left:18px;padding-right:18px}
.btn.ghost{clip-path:none;border-radius:3px}
.alert{border-radius:6px}
footer{border-top:3px solid var(--accent);display:flex;gap:14px;align-items:flex-start}
footer::before{content:"";flex:0 0 auto;width:48px;height:21px;background:url(dg-logo.png) no-repeat left center/contain;margin-top:1px}
@media(max-width:560px){.hero .eyebrow{white-space:nowrap;font-size:9.5px;letter-spacing:.1em}.hero-top img{height:26px}h1{font-size:30px}h2{font-size:18px}.hero::before{font-size:100px;right:40px}.hero::after{width:90px;right:-50px}body{background-size:320px auto,auto,auto}}
.live-note{display:flex;align-items:center;justify-content:center;gap:8px;margin:12px auto 0;width:max-content;max-width:100%;padding:7px 14px;border:1px solid var(--accent);border-radius:999px;font:800 12px/1 Archivo,sans-serif;font-stretch:115%;letter-spacing:.08em;text-transform:uppercase;color:var(--text);background:rgba(255,46,46,.08)}
.live-note .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:0 0 auto}
</style>

// Active incentives. team: 'all' or a team id (bris, adl, per, mel1, mel2, mel3, syd, new).

const TEAMS = [
  {id:'mel',  name:'Melbourne', lead:'', state:'Melbourne'},

const STATES = ['Melbourne','Sydney','Brisbane','Perth','Adelaide'];

const byCode = Object.fromEntries(DATA.map(p=>[p.c,p]));

const fmt = n => n.toLocaleString('en-AU');

const val = (p, per) => per==='week' ? p.w : p.tot;

const rankable = p => !p.host;
const freeTix = p => Math.floor(p.tot/FREE_EVERY);
const toNext = p => FREE_EVERY - (p.tot % FREE_EVERY);

const ranked = DATA.filter(rankable).filter(p=>p.tot>0).slice().sort((a,b)=>b.tot-a.tot);
const RANK = {}; ranked.forEach((p,i)=>{ RANK[p.c] = (i>0 && ranked[i-1].tot===p.tot) ? RANK[ranked[i-1].c] : i+1; });

// remembered code (this browser only)
let ME = null;

function teamStats(id){
  const m = members(id);
  return { codes:m.length, selling:m.filter(p=>p.tot>0).length, tix:m.reduce((a,p)=>a+p.tot,0), week:m.reduce((a,p)=>a+p.w,0) };
}

}

// ---------------- Personal card ----------------
function meCard(p){

  return `<div class="me-card">

      <div style="display:flex;gap:8px;flex-wrap:wrap">${LINKS_LIVE?`<button class="btn sm" data-copy="${esc(p.l)}">Copy my ticket link</button>`:`<span class="pill soon" style="align-self:center">Ticket link coming</span>`}<button class="btn ghost sm" data-forget="1">Not me</button></div>

    <div class="me-nums">

      <div><div class="small">Event-wide rank</div><div class="v">${RANK[p.c]?'#'+RANK[p.c]:'—'}</div></div>

}

}
function teamCard(t){
  return `<a class="card" href="#team-${t.id}"><b style="font-size:18px;margin:0">${esc(t.name)}</b></a>`;
}
function bindHome(){
  const box = document.getElementById('find'), out = document.getElementById('findOut');
  box.addEventListener('input', ()=>{
    const q = box.value.trim().toUpperCase();
    if(q.length<2){ out.innerHTML=''; return; }
    const hits = DATA.filter(p=>p.c.includes(q) || (p.n && p.n.toUpperCase().includes(q))).slice(0,6);
    if(!hits.length){ out.innerHTML='<div class="note">Nothing found. Check the spelling, or ask your team lead.</div>'; return; }
    out.innerHTML = `<table style="margin-top:12px"><thead><tr><th>Code</th><th class="hide-sm">Team</th><th class="n">Tickets</th><th class="n">Rank</th><th></th></tr></thead><tbody>${
      hits.map(p=>`<tr><td>${nameCell(p)}</td><td class="hide-sm">${teamTags(p)}</td><td class="n"><b>${fmt(p.tot)}</b></td><td class="n">${RANK[p.c]?'#'+RANK[p.c]:'—'}</td><td class="n"><button class="btn sm" data-me="${esc(p.c)}">This is me</button></td></tr>`).join('')
    }</tbody></table>`;
  });
}

      <li>Only tickets bought with your code inside the incentive's dates count.</li>
      <li>New incentives are announced in your team group chat and shown on the <a href="#offers">Offers</a> page.</li>
      <li>Winners are worked out from the sales data once the incentive closes.</li>
    </ul>
  </div>
  ${live.length?`<h2>Running now</h2><div class="grid3">${live.map(incCard).join('')}</div>`:''}

  <h2>Incentives we've run before</h2>
  <table><thead><tr><th>Incentive</th><th class="hide-sm">When (2026)</th><th>Reward</th><th>How you earned it</th></tr></thead><tbody>${
    PAST_INCENTIVES.map(x=>`<tr><td><b>${esc(x[0])}</b></td><td class="hide-sm">${esc(x[1])}</td><td>${esc(x[2])}</td><td>${esc(x[3])}</td></tr>`).join('')
  }</tbody></table>
  <div class="note">These are examples, so you know the kinds of rewards to expect. Past incentives have closed.</div>
  </div>
  ${foot()}`;
}

// ---------------- Teams ----------------
function viewTeams(){
  return `
  <a class="back" href="#home">← Home</a>
  <h1>Team <em>dashboards</em></h1>
  <p class="sub">Tap a team to see its promoters.</p>
  <h2>Teams</h2>
  <div class="grid">${TEAMS.map(teamCard).join('')}
  </div>
  ${foot()}`;
}

let ts = {q:'', zero:false, period:'all', all:false};
function viewTeam(id){
  const t = teamById[id], s = teamStats(id), m = members(id);
  const inc = incentivesFor(id);
  const recent = m.filter(p=>p.ls && p.tot>0).sort((a,b)=>b.ls.localeCompare(a.ls)).slice(0,6);
  const free = m.reduce((a,p)=>a+freeTix(p),0);
  return `
  <a class="back" href="#home">← Home</a>
  <h1>${esc(t.name)} <em>dashboard</em></h1>
  <p class="sub">${t.lead?`Team lead: ${esc(t.lead)}`:''}${t.sub?`${t.lead?' · ':''}${esc(t.sub)}`:''}</p>

  <h2>${inc.length?'Active incentives':'How you earn'}</h2>
  ${inc.length ? `<div class="grid3">${inc.map(incCard).join('')}</div>` :
    `<div class="card hot"><span class="pill gold corner">Always on</span><b style="font-size:18px">${FREE_EVERY} sales = 1 free ticket</b><div class="small">No team incentive is running right now. New ones are announced in the group chat and show here.</div></div>`}

  ${s.tix>0?`<div class="stats">
    <div class="stat"><div class="k">Tickets with promoter codes</div><div class="v">${fmt(s.tix)}</div></div>
    <div class="stat"><div class="k">Last 7 days</div><div class="v">${fmt(s.week)}</div></div>
    <div class="stat"><div class="k">Codes selling</div><div class="v">${fmt(s.selling)}<span class="small"> / ${fmt(s.codes)}</span></div></div>
    <div class="stat"><div class="k">Free tickets earned</div><div class="v">${fmt(free)}</div></div>
  </div>`:''}

  ${recent.length?`<h2>Recent sellers</h2><div class="chips">${recent.map(p=>`<div class="chip"><span class="code">${esc(p.c)}</span> <span class="small">· ${day(p.ls)}</span></div>`).join('')}</div>`:''}

  <h2>Team board</h2>
  <div class="tools">
    <div class="grow"><input type="search" id="tq" placeholder="Search code or name"></div>
    <div class="seg" id="tp"><button data-p="all">All time</button><button data-p="week">Last 7 days</button></div>
    <label class="small"><input type="checkbox" id="tz" ${ts.zero?'checked':''}> Show codes with no sales</label>
  </div>
  <div id="tt"></div>
  ${foot()}`;
}
function bindTeam(id){
  const draw = ()=>{
    const q = ts.q.trim().toUpperCase();
    let m = members(id).filter(p=> ts.zero || p.tot>0);
    if(q) m = m.filter(p=>p.c.includes(q) || p.n.toUpperCase().includes(q));
    m.sort((a,b)=>val(b,ts.period)-val(a,ts.period) || b.tot-a.tot || a.c.localeCompare(b.c));
    const total = m.length, show = (ts.all || q) ? m : m.slice(0,15);
    document.querySelectorAll('#tp button').forEach(b=>b.classList.toggle('on', b.dataset.p===ts.period));
    const wk = ts.period==='week';
    if(!members(id).some(p=>p.tot>0)){
      document.getElementById('tp').style.display='none'; document.getElementById('tz').parentElement.style.display='none';
      document.getElementById('tt').innerHTML = total ? `<table><thead><tr><th>Promoter</th><th class="n">Ticket link</th></tr></thead><tbody>${
        m.map(p=>`<tr class="${p.c===ME?'me':''}"><td>${nameCell(p)}</td><td class="n">${copyBtn(p)}</td></tr>`).join('')}</tbody></table>` : '<div class="empty">No promoters on this team yet.</div>';
      return;
    }
    document.getElementById('tt').innerHTML = total ? `<table><thead><tr><th>#</th><th>Promoter</th><th class="n">${wk?'7 days':'Tickets'}</th><th class="n hide-sm">${wk?'All time':'7 days'}</th><th class="n hide-sm">Free tix</th><th class="hide-sm">Last sale</th><th class="n">Ticket link</th></tr></thead><tbody>${
      show.map((p,i)=>`<tr class="top${i+1}${p.c===ME?' me':''}"><td class="rk">${i+1}</td><td>${nameCell(p)}</td><td class="n"><b>${fmt(val(p,ts.period))}</b></td><td class="n hide-sm">${fmt(wk?p.tot:p.w)}</td><td class="n hide-sm">${freeTix(p)||'—'}</td><td class="hide-sm">${day(p.ls)}</td><td class="n">${copyBtn(p)}</td></tr>`).join('')
    }</tbody></table>${total>show.length?`<div style="margin-top:10px"><button class="btn ghost" id="tall">Show all ${fmt(total)}</button></div>`:''}` : '<div class="empty">No promoters on this team yet.</div>';
    const b = document.getElementById('tall'); if(b) b.onclick = ()=>{ ts.all=true; draw(); };
  };
  document.getElementById('tq').addEventListener('input', e=>{ts.q=e.target.value; draw();});
  document.getElementById('tz').addEventListener('change', e=>{ts.zero=e.target.checked; draw();});
  document.getElementById('tp').addEventListener('click', e=>{ if(e.target.dataset.p){ts.period=e.target.dataset.p; draw();} });
  draw();
}

// ---------------- Leaderboard ----------------
let lbPeriod = 'all', lbAll = false;
function viewLeaderboard(){
  return `
  <a class="back" href="#home">← Home</a>
  <div style="margin-top:16px"><span class="pill gold">Event-wide · every state · every team</span></div>
  <h1 style="margin-top:10px">Event-wide <em>leaderboard</em></h1>
  <p class="sub">One board for the whole of DG XXL 2027. Every promoter in Melbourne, Sydney, Brisbane, Perth, Adelaide and Multi-State is ranked together here, not team by team.</p>
  <div class="card hot" style="margin-top:14px"><b style="font-size:17px">🏆 This is the whole event, not just your team</b>
    <div class="small">Your rank here is against every DG promoter in Australia. Team vs team and state vs state sit underneath.</div></div>
  <div class="tools"><div class="seg" id="lp"><button data-p="all">All time</button><button data-p="week">Last 7 days</button></div></div>
  <div id="lb"></div>
  ${foot()}`;
}
function bindLeaderboard(){
  const draw = ()=>{
    document.querySelectorAll('#lp button').forEach(b=>b.classList.toggle('on', b.dataset.p===lbPeriod));
    const per = lbPeriod;
    const all = DATA.filter(rankable).filter(p=>val(p,per)>0).sort((a,b)=>val(b,per)-val(a,per)||b.tot-a.tot);
    if(!DATA.some(p=>p.tot>0)){ document.getElementById('lb').innerHTML='<div class="note">Sales go live here from the start of the June event. The leaderboard and the team and state charts fill in from then.</div>'; return; }
    const top = lbAll ? all : all.slice(0,25);
    const mine = ME ? all.findIndex(p=>p.c===ME) : -1;
    const teams = TEAMS.filter(t=>!t.other).map(t=>({t, v:members(t.id).reduce((a,p)=>a+val(p,per),0)})).sort((a,b)=>b.v-a.v);
    const tmax = Math.max(1,...teams.map(x=>x.v));
    const st = STATES.map(s=>({s, v:DATA.reduce((a,p)=>a+(p.s[s]||0),0)})).sort((a,b)=>b.v-a.v);
    const smax = Math.max(1,...st.map(x=>x.v));
    const row = (p,i)=>`<tr class="top${i+1}${p.c===ME?' me':''}"><td class="rk">${i+1}</td><td><span class="code">${esc(p.c)}</span></td><td>${teamTags(p)}</td><td class="n"><b>${fmt(val(p,per))}</b></td></tr>`;
    document.getElementById('lb').innerHTML = `
    <h2>Event-wide rankings · all promoters</h2>
    ${top.length?`<table><thead><tr><th>#</th><th>Code</th><th>Team</th><th class="n">Tickets</th></tr></thead><tbody>${
      top.map(row).join('')}${(!lbAll && mine>=25)?`<tr><td colspan="4" class="small" style="text-align:center">…</td></tr>${row(all[mine],mine)}`:''}
    </tbody></table>${all.length>top.length?`<div style="margin-top:10px"><button class="btn ghost" id="lall">Show all ${fmt(all.length)} codes</button></div>`:''}`:'<div class="empty">No sales in this period yet.</div>'}

    <h2>Team vs team</h2>
    <div class="card"><div class="bars">${
      teams.map((x,i)=>`<div class="bar${i===0&&x.v?' lead':''}"><a href="#team-${x.t.id}">${esc(x.t.name)}</a><div class="track"><div class="fill" style="width:${(x.v/tmax*100).toFixed(1)}%"></div></div><div class="v">${fmt(x.v)}</div></div>`).join('')
    }</div><div class="small" style="margin-top:10px">Tickets sold with each team's codes, wherever the ticket was for. </div></div>

    <h2>State vs state <span style="text-transform:none;letter-spacing:0">· all time</span></h2>
    <div class="card"><div class="bars">${
      st.map((x,i)=>`<div class="bar${i===0?' lead':''}"><span>${x.s}</span><div class="track"><div class="fill" style="width:${(x.v/smax*100).toFixed(1)}%"></div></div><div class="v">${fmt(x.v)}</div></div>`).join('')
    }</div><div class="small" style="margin-top:10px">Promoter-code tickets for each state's event. A Sydney ticket sold by a Multi-State promoter counts for Multi-State above and Sydney here.</div></div>`;
    const b = document.getElementById('lall'); if(b) b.onclick = ()=>{ lbAll=true; draw(); };
  };
  document.getElementById('lp').addEventListener('click', e=>{ if(e.target.dataset.p){lbPeriod=e.target.dataset.p; draw();} });
  draw();
}

// ---------------- Router ----------------
function route(){
  const h = (location.hash||'#home').slice(1);
  const app = document.getElementById('app');
  let r = 'home';
  if(h==='teams'){ r='teams'; app.innerHTML=viewTeams(); }
  else if(h==='offers'){ r='offers'; app.innerHTML=viewOffers(); }
  else if(h==='rules'){ r='rules'; app.innerHTML=viewRules(); }
  else if(h==='leaderboard'){ r='leaderboard'; lbAll=false; app.innerHTML=viewLeaderboard(); bindLeaderboard(); }
  else if(h.startsWith('team-') && teamById[h.slice(5)]){ r='teams'; ts={q:'',zero:true,period:'all',all:false}; app.innerHTML=viewTeam(h.slice(5)); bindTeam(h.slice(5)); }
  else { app.innerHTML=viewHome(); bindHome(); }
  brandHero(app);
  document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('on', a.dataset.r===r));
  window.scrollTo(0,0);
}
// DG-style banner (like the Promoter Agreement image) around each page's title
function brandHero(app){
  const h1 = app.querySelector('h1'); if(!h1) return;
  const hero = document.createElement('div'); hero.className = 'hero';
  hero.innerHTML = '<div class="hero-top"><img src="dg-logo.png" alt="DG"><span class="eyebrow">Dangerous Goods · XXL</span></div>';
  h1.parentNode.insertBefore(hero, h1);
  hero.appendChild(h1);
  const sub = hero.nextElementSibling;
  if(sub && sub.classList.contains('sub')) hero.appendChild(sub);
  const bar = document.createElement('div'); bar.className = 'hero-rule'; hero.appendChild(bar);
}
document.addEventListener('click', async e=>{
  const m = e.target.closest('[data-me]');
  if(m){ setMe(m.dataset.me); route(); return; }
  if(e.target.closest('[data-forget]')){ setMe(null); route(); return; }
  const b = e.target.closest('[data-copy]'); if(!b) return;
  const old = b.innerHTML;
  try{ await navigator.clipboard.writeText(b.dataset.copy); b.textContent='Copied ✓'; b.classList.add('copied'); }
  catch(err){ b.textContent=b.dataset.copy; }
  setTimeout(()=>{ if(b.isConnected){ b.innerHTML=old; b.classList.remove('copied'); } }, 1800);
});
window.addEventListener('hashchange', route);
route();
})();
</script>
